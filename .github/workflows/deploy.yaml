name: AuraMed Production DevSecOps & GitOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  # ============================================================================
  # 1. Multi-Language Linting & Automated Test Matrix
  # ============================================================================
  lint-and-test:
    name: Build & Unit Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            auramed/ingestion-gateway/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust Tests (Zero-PHI Ingestion Gateway)
        run: |
          cargo test --manifest-path auramed/ingestion-gateway/Cargo.toml --verbose

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Java Flink Tests (Adherence Sliding Window)
        run: |
          mvn test -f auramed/streaming-job/pom.xml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r auramed/knowledge-graph/requirements.txt
          pip install -r auramed/cds-hooks-service/requirements.txt
          pip install torch numpy scipy pytest pytest-asyncio pydantic

      - name: Run Python PyTest Matrix (Knowledge Graph, ML Core, CDS Hooks)
        run: |
          pytest auramed/knowledge-graph/ -v
          pytest auramed/ml-core/ -v
          pytest auramed/cds-hooks-service/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: auramed/smart-on-fhir-app/package.json

      - name: Build SMART-on-FHIR Clinical UI
        run: |
          npm ci --prefix auramed/smart-on-fhir-app
          npm run build --prefix auramed/smart-on-fhir-app

  # ============================================================================
  # 2. Automated DevSecOps: SAST & Container Vulnerability Scanning
  # ============================================================================
  security-scan:
    name: Semgrep SAST & Trivy Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Semgrep SAST Code Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/r2c-security-headers
        env:
          SEMGREP_RULES: p/security-audit

      - name: Build Gateway Container for Vulnerability Scan
        run: |
          docker build -t auramed/ingestion-gateway:local auramed/ingestion-gateway

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'auramed/ingestion-gateway:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # 3. Clinical Safety Gate: Conformal Coverage Validation
  # ============================================================================
  clinical-safety-gate:
    name: Conformal Prediction Clinical Safety Gate (>= 90% Coverage)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Validation Dependencies
        run: |
          pip install numpy

      - name: Execute Algorithmic Clinical Safety Gate
        run: |
          PYTHONPATH=auramed/ml-core python auramed/ml-core/validate_conformal_safety.py

  # ============================================================================
  # 4. GitOps Deployment Sync (ArgoCD)
  # ============================================================================
  gitops-deploy:
    name: GitOps ArgoCD Production Sync
    runs-on: ubuntu-latest
    needs: [security-scan, clinical-safety-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC IAM Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/auramed-github-actions-deployer
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Production Container Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building and pushing container images with tag: $IMAGE_TAG"
          docker build -t $ECR_REGISTRY/auramed/ingestion-gateway:$IMAGE_TAG auramed/ingestion-gateway
          docker push $ECR_REGISTRY/auramed/ingestion-gateway:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/auramed/cds-hooks:$IMAGE_TAG auramed/cds-hooks-service
          docker push $ECR_REGISTRY/auramed/cds-hooks:$IMAGE_TAG

      - name: Trigger ArgoCD GitOps Cluster Synchronization
        env:
          ARGOCD_SERVER: argocd.auramed.internal
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APP_NAME: auramed-production
        run: |
          echo "Triggering ArgoCD automated sync for $APP_NAME to revision ${{ github.sha }}..."
          curl -k -X POST "https://$ARGOCD_SERVER/api/v1/applications/$APP_NAME/sync" \
            -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"revision": "'"${{ github.sha }}"'", "prune": true}' || true
          echo "ArgoCD GitOps synchronization initiated successfully."

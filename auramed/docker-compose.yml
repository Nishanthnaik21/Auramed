version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Apache Kafka (KRaft Single-Node Mode)
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: auramed-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-cluster cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Topic Initialization
  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # Create partitioned topics for patient routing
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic telemetry.claims.dispense --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic telemetry.clinical.observations --partitions 12 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic telemetry.clinical.encounters --partitions 12 --replication-factor 1
      echo 'Kafka topics created successfully'
      "

  # --------------------------------------------------------------------------
  # Redis (Feast Online Feature Store)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: auramed-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # MinIO (S3 Compatible Storage for Apache Iceberg Lakehouse)
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: auramed-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"

  # --------------------------------------------------------------------------
  # Neo4j 5.x (Pharmacology Knowledge Graph)
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: auramed-neo4j
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: "neo4j/auramedpassword"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: "512M"
      NEO4J_dbms_memory_heap_initial__size: "512M"
      NEO4J_dbms_memory_heap_max__size: "1G"
    volumes:
      - ./knowledge-graph/seed_pharmacology.cypher:/var/lib/neo4j/import/seed_pharmacology.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p auramedpassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Rust Ingestion Gateway Tier
  # --------------------------------------------------------------------------
  ingestion-gateway:
    build:
      context: ./ingestion-gateway
      dockerfile: Dockerfile
    container_name: auramed-ingestion-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      KAFKA_BROKERS: "kafka:29092"
      TOPIC_DISPENSE: "telemetry.claims.dispense"
      TOPIC_OBSERVATIONS: "telemetry.clinical.observations"
      TOPIC_ENCOUNTERS: "telemetry.clinical.encounters"
      AURAMED_MASTER_SECRET: "c3VwZXItc2VjcmV0LWhlYWx0aGNhcmUta21zLW1hc3Rlci1rZXktMzJieXRlcw=="
      AURAMED_SALT: "auramed_phi_pepper_2026_prod"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --------------------------------------------------------------------------
  # Apache Flink Streaming Engine (JobManager & TaskManager)
  # --------------------------------------------------------------------------
  flink-jobmanager:
    build:
      context: ./streaming-job
      dockerfile: Dockerfile
    container_name: auramed-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  flink-taskmanager:
    build:
      context: ./streaming-job
      dockerfile: Dockerfile
    container_name: auramed-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    scale: 2
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
